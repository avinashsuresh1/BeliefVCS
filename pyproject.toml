[project]
name = "library4agents"
version = "0.1.0"
description = "BeliefVCS: Version Control System for AI Agent Beliefs & Cognitive CI/CD"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "avinashsuresh1", email = "avinashsuresh1@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["library4agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
